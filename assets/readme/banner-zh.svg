<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title description">
  <title id="title">Skilnex — 讓 Agent 技能，整理有序、同步有據。</title>
  <desc id="description">米白與深綠品牌封面。左側為 Skilnex 名稱與產品標語，右側以技能文件及 Agent 節點呈現閱讀、預覽、確認後同步的概念。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f6ef"/>
      <stop offset="1" stop-color="#e8eddf"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d3ddca" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1440" height="440" rx="24" fill="url(#paper)"/>
  <rect x="1" y="1" width="1438" height="438" rx="23" fill="none" stroke="#d1dbc8" stroke-width="2"/>
  <path d="M24 0H1416A24 24 0 0 1 1440 24V8H0V24A24 24 0 0 1 24 0Z" fill="#173e34"/>
  <rect x="815" y="40" width="570" height="360" rx="20" fill="url(#grid)" opacity=".52"/>
  <g font-family="Segoe UI, Arial, Microsoft JhengHei, sans-serif">
    <circle cx="78" cy="79" r="4" fill="#326d50"/>
    <text x="94" y="84" fill="#326d50" font-size="13" font-weight="600" letter-spacing="2.5">YOUR SKILLS. YOUR CONTROL.</text>
    <text x="72" y="203" fill="#173e34" font-size="100" font-weight="750" letter-spacing="-5">Skilnex<tspan fill="#5b8253">.</tspan></text>
    <text x="76" y="260" fill="#304b3b" font-size="29" font-weight="600">讓 Agent 技能，整理有序、同步有據。</text>
    <text x="78" y="303" fill="#5c6f5b" font-size="17" letter-spacing="1">盤點來源  /  讀懂內容  /  預覽差異  /  確認同步</text>
    <g font-size="12" font-weight="600">
      <rect x="76" y="348" width="113" height="30" rx="15" fill="#173e34"/>
      <text x="132.5" y="368" fill="#fffefa" text-anchor="middle">Windows x64</text>
      <rect x="199" y="348" width="107" height="30" rx="15" fill="#e3eada" stroke="#bccdb2"/>
      <text x="252.5" y="368" fill="#3c5b37" text-anchor="middle">Local-first</text>
      <text x="327" y="368" fill="#5c6f5b" font-weight="400">SKILLS, NOT SILOS.</text>
    </g>
    <g stroke="#93aa88" stroke-width="1.5" fill="none">
      <path d="M1110 235V278M933 310V278H1287V310"/>
      <path d="M1105 302L1110 307L1115 302M928 302L933 307L938 302M1282 302L1287 307L1292 302"/>
