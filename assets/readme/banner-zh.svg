    <rect x="942" y="81" width="336" height="168" rx="13" fill="#173e34" opacity=".06"/>
    <rect x="934" y="73" width="336" height="168" rx="13" fill="#fffefa" stroke="#b9cbb0"/>
    <path d="M948 73H1256A14 14 0 0 1 1270 87V123H934V87A14 14 0 0 1 948 73Z" fill="#f0f3e9"/>
    <path d="M934 123H1270" fill="none" stroke="#d1ddc8"/>
    <rect x="954" y="89" width="18" height="20" rx="3" fill="none" stroke="#53744b" stroke-width="1.5"/>
    <path d="M959 95H967M959 100H967M959 105H964" stroke="#53744b" stroke-width="1.5"/>
    <text x="986" y="104" fill="#29472f" font-size="15" font-weight="600">SKILL.md</text>
    <text x="1224" y="103" fill="#65785b" font-size="11" text-anchor="end">本機技能</text>
    <g font-family="Consolas, monospace" font-size="13">
      <text x="957" y="155" fill="#376442">name: <tspan fill="#56674f">code-review</tspan></text>
      <text x="957" y="180" fill="#376442">includes: <tspan fill="#56674f">references/</tspan></text>
    </g>
    <circle cx="961" cy="213" r="3" fill="#326d50"/>
    <text x="973" y="217" fill="#526c45" font-size="11">先看差異，再決定。</text>
    <g fill="#fffefa" stroke="#bccdb2">
      <rect x="862" y="314" width="142" height="49" rx="9"/>
